<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="t d"><title id="t">Examiner profile</title><desc id="d">Casework: Windows endpoints — Registry, $MFT/USN, EVTX, Prefetch, Amcache, SRUM, VSS, RDP cache; Mobile &amp; connected devices — iOS app extractions and the traces phones leave on computers; Incident response — Triage at scale, super-timelines, intrusion and ransomware cases; Examination automation — Case-type pipelines that end in a court-ready, verifiable report. Principles: Read-only, always — Evidence is copied and hashed before anything parses it.; Every fact has a source — File, SHA-256 and an offset or row id you can find by hand.; Validated, not assumed — Checked against published answer keys: NIST CFReDS, DFIR Madness.; Automate the routine — The tool does the repetitive work. The examiner makes the call..</desc><style>@font-face{font-family:'p-mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.mono{font-family:'p-mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-weight:400}@font-face{font-family:'p-mono6';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}.mono6{font-family:'p-mono6',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-weight:600}@font-face{font-family:'p-sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.sans{font-family:'p-sans',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-weight:400}@font-face{font-family:'p-sans6';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}.sans6{font-family:'p-sans6',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-weight:600}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="k"><rect width="1200" height="410" rx="14"/></clipPath></defs><rect x="0.5" y="0.5" width="1199" height="409" rx="13.5" fill="#10151C" stroke="#262F3B"/><g clip-path="url(#k)"><rect x="0" y="0" width="1200" height="48" rx="0" fill="#151C25"/></g><line x1="0" y1="48.5" x2="1200" y2="48.5" stroke="#262F3B" stroke-width="1"/><text x="28" y="29" class="mono" font-size="11.5" fill="#8590A0" letter-spacing="1.4">FORM DF-01 · EXAMINER PROFILE</text><text x="1172" y="29" class="mono" font-size="11.5" fill="#8590A0" text-anchor="end" letter-spacing="1.4">REF SA-2026-001 · PAGE 1 / 1</text><line x1="612.5" y1="76" x2="612.5" y2="382" stroke="#1C242E" stroke-width="1"/><text x="36" y="92" class="mono6" font-size="12" fill="#FFD23F" letter-spacing="2.4">CASEWORK</text><text x="648" y="92" class="mono6" font-size="12" fill="#FFD23F" letter-spacing="2.4">PRINCIPLES</text><rect x="36.5" y="108.5" width="39" height="39" rx="9" fill="#151C25" stroke="#262F3B"/><rect x="47.5" y="119.5" width="7.5" height="7.5" rx="1.2" fill="#B7C0CA"/><rect x="47.5" y="129" width="7.5" height="7.5" rx="1.2" fill="#B7C0CA"/><rect x="57" y="119.5" width="7.5" height="7.5" rx="1.2" fill="#B7C0CA"/><rect x="57" y="129" width="7.5" height="7.5" rx="1.2" fill="#B7C0CA"/><text x="92" y="131" class="sans6" font-size="17" fill="#E6EDF3">Windows endpoints</text><text x="92" y="154" class="sans" font-size="14.5" fill="#8590A0">Registry, $MFT/USN, EVTX, Prefetch, Amcache, SRUM, VSS, RDP cache</text><rect x="36.5" y="180.5" width="39" height="39" rx="9" fill="#151C25" stroke="#262F3B"/><rect x="49.5" y="189.5" width="13" height="21" rx="2.6" stroke="#B7C0CA" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="54" y1="206.5" x2="58" y2="206.5" stroke="#B7C0CA" stroke-width="1.7" stroke-linecap="round"/><text x="92" y="203" class="sans6" font-size="17" fill="#E6EDF3">Mobile &amp; connected devices</text><text x="92" y="226" class="sans" font-size="14.5" fill="#8590A0">iOS app extractions and the traces phones leave on computers</text><rect x="36.5" y="252.5" width="39" height="39" rx="9" fill="#151C25" stroke="#262F3B"/><path d="M45 272h5l2.6-7 4.6 14 2.8-7h7" stroke="#B7C0CA" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="275" class="sans6" font-size="17" fill="#E6EDF3">Incident response</text><text x="92" y="298" class="sans" font-size="14.5" fill="#8590A0">Triage at scale, super-timelines, intrusion and ransomware cases</text><rect x="36.5" y="324.5" width="39" height="39" rx="9" fill="#151C25" stroke="#262F3B"/><path d="M50 339h12M50 339L56 350M62 339L56 350" stroke="#B7C0CA" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="49" cy="338.5" r="3.2" fill="#B7C0CA"/><circle cx="63" cy="338.5" r="3.2" fill="#B7C0CA"/><circle cx="56" cy="351" r="3.2" fill="#B7C0CA"/><text x="92" y="347" class="sans6" font-size="17" fill="#E6EDF3">Examination automation</text><text x="92" y="370" class="sans" font-size="14.5" fill="#8590A0">Case-type pipelines that end in a court-ready, verifiable report</text><text x="648" y="131" class="mono6" font-size="14" fill="#FFD23F" letter-spacing="0.5">01</text><text x="688" y="131" class="sans6" font-size="17" fill="#E6EDF3">Read-only, always</text><text x="688" y="154" class="sans" font-size="14.5" fill="#8590A0">Evidence is copied and hashed before anything parses it.</text><text x="648" y="203" class="mono6" font-size="14" fill="#FFD23F" letter-spacing="0.5">02</text><text x="688" y="203" class="sans6" font-size="17" fill="#E6EDF3">Every fact has a source</text><text x="688" y="226" class="sans" font-size="14.5" fill="#8590A0">File, SHA-256 and an offset or row id you can find by hand.</text><text x="648" y="275" class="mono6" font-size="14" fill="#FFD23F" letter-spacing="0.5">03</text><text x="688" y="275" class="sans6" font-size="17" fill="#E6EDF3">Validated, not assumed</text><text x="688" y="298" class="sans" font-size="14.5" fill="#8590A0">Checked against published answer keys: NIST CFReDS, DFIR Madness.</text><text x="648" y="347" class="mono6" font-size="14" fill="#FFD23F" letter-spacing="0.5">04</text><text x="688" y="347" class="sans6" font-size="17" fill="#E6EDF3">Automate the routine</text><text x="688" y="370" class="sans" font-size="14.5" fill="#8590A0">The tool does the repetitive work. The examiner makes the call.</text></svg>
